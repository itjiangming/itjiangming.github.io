<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:13px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
  </style>

  <text class="t" x="270" y="30">HTTP 协议演进：1.1 → 2 → 3 (QUIC)</text>

  <!-- HTTP1.1 -->
  <rect class="b" x="50" y="60" width="220" height="210" rx="10"/>
  <text class="n" x="160" y="90" text-anchor="middle">HTTP/1.1（1997）</text>
  <text class="s" x="70" y="120">文本协议，keep-alive复用连接</text>
  <text class="s" x="70" y="148">问题：队头阻塞 ——</text>
  <text class="s" x="70" y="168">同一连接上响应必须按序返回，</text>
  <text class="s" x="70" y="188">前一个慢了全部排队等待</text>
  <text class="s" x="70" y="216">缓解：浏览器6个并行连接，</text>
  <text class="s" x="70" y="236">资源分域名散列（已过时）</text>

  <!-- HTTP2 -->
  <rect class="g" x="290" y="60" width="220" height="210" rx="10"/>
  <text class="n" x="400" y="90" text-anchor="middle">HTTP/2（2015）</text>
  <text class="s" x="310" y="120">二进制分帧，多路复用：一条</text>
  <text class="s" x="310" y="140">TCP连接并发多个流</text>
  <text class="s" x="310" y="168">新增：头部压缩(HPACK)、</text>
  <text class="s" x="310" y="188">服务端推送、流优先级</text>
  <text class="s" x="310" y="216">仍遗留：TCP层队头阻塞，</text>
  <text class="s" x="310" y="236">丢包会阻塞整个连接的流</text>

  <!-- HTTP3 -->
  <rect class="m" x="530" y="60" width="220" height="210" rx="10"/>
  <text class="n" x="640" y="90" text-anchor="middle">HTTP/3（QUIC，2022）</text>
  <text class="s" x="550" y="120">基于UDP重新设计传输层，</text>
  <text class="s" x="550" y="140">彻底解决队头阻塞</text>
  <text class="s" x="550" y="168">新增：0-RTT连接建立、</text>
  <text class="s" x="550" y="188">内置TLS1.3、连接迁移</text>
  <text class="s" x="550" y="216">（WiFi↔蜂窝切换不断线）</text>
  <text class="s" x="550" y="244">OkHttp 5+ 已支持</text>

  <!-- 箭头 -->
  <text class="n" x="272" y="160" text-anchor="middle">→</text>
  <text class="n" x="512" y="160" text-anchor="middle">→</text>

  <!-- 底部：客户端实践 -->
  <rect class="b" x="50" y="295" width="700" height="115" rx="10"/>
  <text class="n" x="400" y="323" text-anchor="middle">客户端相关实践</text>
  <text class="s" x="70" y="350">✔ HTTPDNS：绕过运营商LocalDNS的劫持与解析不准，App内直接查IP再直连（大厂标配）</text>
  <text class="s" x="70" y="375">✔ 多网络监测：ConnectivityManager感知Wi-Fi/蜂窝切换，切换时重建长连接</text>
  <text class="s" x="70" y="400">✔ CDN：静态资源走边缘节点（域名解析到的IP即CDN节点）</text>
</svg>
