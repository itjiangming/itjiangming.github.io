<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="hg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4caf7d"/>
    </marker>
  </defs>
  <style>
    .t { font-size:16px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:13px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:11px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .line { stroke:#4a90d9; stroke-width:2; fill:none; }
    .dashg { stroke:#4caf7d; stroke-width:2; fill:none; stroke-dasharray:6,4; }
    .slot { fill:#dde7f2; stroke:#8fb8dc; stroke-width:1.5; }
    .msgdot { fill:#e07b39; stroke:#b3551e; stroke-width:1.5; }
    .dotlabel { font-size:10px; fill:#ffffff; font-weight:bold; }
  </style>

  <text class="t" x="260" y="28">Handler 消息机制动态演示</text>

  <!-- ===== 静态骨架 ===== -->
  <!-- A 发送端 -->
  <rect class="b" x="40" y="165" width="180" height="100" rx="10"/>
  <text class="n" x="130" y="192" text-anchor="middle">工作线程</text>
  <text class="s" x="130" y="215" text-anchor="middle">handler.sendMessage(msg)</text>
  <text class="s" x="130" y="235" text-anchor="middle">handler.post(runnable)</text>

  <!-- B MessageQueue -->
  <rect class="b" x="300" y="150" width="160" height="130" rx="10"/>
  <text class="n" x="380" y="178" text-anchor="middle">MessageQueue</text>
  <text class="s" x="380" y="198" text-anchor="middle">按 when 排序的单链表</text>
  <rect class="slot" x="330" y="212" width="100" height="16" rx="4"/>
  <rect class="slot" x="330" y="234" width="100" height="16" rx="4"/>
  <rect class="slot" x="330" y="256" width="100" height="16" rx="4"/>

  <!-- C Looper -->
  <rect class="g" x="540" y="150" width="150" height="130" rx="10"/>
  <text class="n" x="615" y="178" text-anchor="middle">Looper.loop()</text>
  <text class="s" x="615" y="200" text-anchor="middle">死循环：next()取消息</text>
  <text class="s" x="615" y="218" text-anchor="middle">取不到 → epoll休眠</text>
  <text class="s" x="615" y="236" text-anchor="middle">有消息/到期 → 唤醒</text>

  <!-- D 主线程处理 -->
  <rect class="b" x="490" y="330" width="240" height="100" rx="10"/>
  <text class="n" x="610" y="358" text-anchor="middle">主线程执行</text>
  <text class="s" x="610" y="382" text-anchor="middle">dispatchMessage(msg)</text>
  <text class="s" x="610" y="402" text-anchor="middle">→ handleMessage() → 更新UI</text>

  <!-- E 对象池 -->
  <rect class="m" x="210" y="330" width="200" height="100" rx="10"/>
  <text class="n" x="310" y="358" text-anchor="middle">Message 对象池</text>
  <text class="s" x="310" y="382" text-anchor="middle">recycleUnchecked() 回收</text>
  <text class="s" x="310" y="402" text-anchor="middle">obtain() 复用（避免内存抖动）</text>

  <!-- 流向箭头 -->
  <path class="line" d="M220 215 H 295" marker-end="url(#ha)"/>
  <text class="s" x="235" y="205" fill="#2c5f9e">① 入队</text>
  <path class="line" d="M460 215 H 535" marker-end="url(#ha)"/>
  <text class="s" x="475" y="205" fill="#2c5f9e">② next()取消息</text>
  <path class="line" d="M615 280 C 615 310, 660 315, 660 325" marker-end="url(#ha)"/>
  <text class="s" x="628" y="308" fill="#2c5f9e">③ 派发</text>
  <path class="dashg" d="M490 380 H 415" marker-end="url(#hg)"/>
  <text class="s" x="430" y="370" fill="#4caf7d">④ 回收复用</text>

  <!-- 对象池回队（虚线） -->
  <path class="dashg" d="M310 330 C 310 300, 340 290, 345 285" marker-end="url(#hg)"/>
  <text class="s" x="255" y="300" fill="#4caf7d">obtain()取出复用</text>

  <!-- ===== 动态元素 ===== -->
  <!-- leg1: 发送→入队（三点错峰） -->
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M220,215 L300,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="2.6s" repeatCount="indefinite" path="M220,215 L300,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="2.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="5.2s" repeatCount="indefinite" path="M220,215 L300,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="5.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>

  <!-- leg2: 出队→Looper -->
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M460,215 L540,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="1.1s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="3.7s" repeatCount="indefinite" path="M460,215 L540,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="3.7s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="6.3s" repeatCount="indefinite" path="M460,215 L540,215"/>
    <animate attributeName="opacity" dur="1.8s" begin="6.3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>

  <!-- leg3: Looper→主线程派发 -->
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="2.2s" repeatCount="indefinite" path="M615,280 C 615,310, 655,315, 660,325"/>
    <animate attributeName="opacity" dur="1.8s" begin="2.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="4.8s" repeatCount="indefinite" path="M615,280 C 615,310, 655,315, 660,325"/>
    <animate attributeName="opacity" dur="1.8s" begin="4.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle class="msgdot" r="8" opacity="0">
    <animateMotion dur="1.8s" begin="7.4s" repeatCount="indefinite" path="M615,280 C 615,310, 655,315, 660,325"/>
    <animate attributeName="opacity" dur="1.8s" begin="7.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>

  <!-- leg4: 回收→对象池（绿色点） -->
  <circle r="8" fill="#4caf7d" stroke="#2e7d54" stroke-width="1.5" opacity="0">
    <animateMotion dur="1.8s" begin="3.4s" repeatCount="indefinite" path="M490,380 H 415"/>
    <animate attributeName="opacity" dur="1.8s" begin="3.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>
  <circle r="8" fill="#4caf7d" stroke="#2e7d54" stroke-width="1.5" opacity="0">
    <animateMotion dur="1.8s" begin="6.0s" repeatCount="indefinite" path="M490,380 H 415"/>
    <animate attributeName="opacity" dur="1.8s" begin="6.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </circle>

  <!-- 队列slot被占用的闪烁演示 -->
  <rect class="slot" x="330" y="212" width="100" height="16" rx="4">
    <animate attributeName="fill" dur="7.8s" repeatCount="indefinite"
      values="#dde7f2;#f6c99a;#dde7f2;#dde7f2;#f6c99a;#dde7f2;#dde7f2;#dde7f2"
      keyTimes="0;0.12;0.25;0.4;0.52;0.65;0.8;1"/>
  </rect>
  <rect class="slot" x="330" y="234" width="100" height="16" rx="4">
    <animate attributeName="fill" dur="7.8s" repeatCount="indefinite"
      values="#dde7f2;#dde7f2;#f6c99a;#dde7f2;#dde7f2;#f6c99a;#dde7f2;#dde7f2"
      keyTimes="0;0.12;0.25;0.4;0.52;0.65;0.8;1"/>
  </rect>
  <rect class="slot" x="330" y="256" width="100" height="16" rx="4">
    <animate attributeName="fill" dur="7.8s" repeatCount="indefinite"
      values="#dde7f2;#dde7f2;#dde7f2;#f6c99a;#dde7f2;#dde7f2;#f6c99a;#dde7f2"
      keyTimes="0;0.12;0.25;0.4;0.52;0.65;0.8;1"/>
  </rect>

  <!-- 图例 -->
  <circle class="msgdot" cx="70" cy="448" r="6"/>
  <text class="s" x="82" y="452">橙色点：消息流转（发送→入队→取→派发）</text>
  <circle cx="320" cy="448" r="6" fill="#4caf7d" stroke="#2e7d54" stroke-width="1.5"/>
  <text class="s" x="332" y="452">绿色点：消息回收进入对象池复用</text>
</svg>
