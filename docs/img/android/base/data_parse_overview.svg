<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:14px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .p { stroke:#4a90d9; stroke-width:2.2; fill:none; marker-end:url(#dp); }
  </style>

  <text class="t" x="290" y="30">数据解析：从网络字节流到 UI 对象</text>

  <!-- 反序列化流水线（上行） -->
  <rect class="b" x="50" y="60" width="150" height="80" rx="10"/>
  <text class="n" x="125" y="92" text-anchor="middle">服务器响应</text>
  <text class="s" x="125" y="115" text-anchor="middle">JSON/XML 字符串</text>

  <rect class="m" x="250" y="60" width="170" height="80" rx="10"/>
  <text class="n" x="335" y="92" text-anchor="middle">解析器（反序列化）</text>
  <text class="s" x="335" y="115" text-anchor="middle">Gson / Moshi / XmlPullParser</text>

  <rect class="b" x="470" y="60" width="140" height="80" rx="10"/>
  <text class="n" x="540" y="92" text-anchor="middle">数据对象（DTO）</text>
  <text class="s" x="540" y="108" text-anchor="middle">User 对象</text>
  <text class="s" x="540" y="126" text-anchor="middle">List&lt;Article&gt;</text>

  <rect class="g" x="650" y="60" width="100" height="80" rx="10"/>
  <text class="n" x="700" y="92" text-anchor="middle">UI 展示</text>
  <text class="s" x="700" y="115" text-anchor="middle">TextView/列表</text>

  <path class="p" d="M200 100 H 245"/>
  <path class="p" d="M420 100 H 465"/>
  <path class="p" d="M610 100 H 645"/>

  <!-- 序列化流水线（下行） -->
  <rect class="b" x="50" y="270" width="150" height="80" rx="10"/>
  <text class="n" x="125" y="302" text-anchor="middle">提交数据</text>
  <text class="s" x="125" y="325" text-anchor="middle">表单/对象</text>

  <rect class="m" x="250" y="270" width="170" height="80" rx="10"/>
  <text class="n" x="335" y="302" text-anchor="middle">序列化</text>
  <text class="s" x="335" y="325" text-anchor="middle">对象 → JSON 字符串</text>

  <rect class="b" x="470" y="270" width="140" height="80" rx="10"/>
  <text class="n" x="540" y="302" text-anchor="middle">请求体</text>
  <text class="s" x="540" y="325" text-anchor="middle">RequestBody</text>

  <rect class="g" x="650" y="270" width="100" height="80" rx="10"/>
  <text class="n" x="700" y="302" text-anchor="middle">服务器</text>
  <text class="s" x="700" y="325" text-anchor="middle">处理入库</text>

  <path class="p" d="M200 310 H 245"/>
  <path class="p" d="M420 310 H 465"/>
  <path class="p" d="M610 310 H 645"/>

  <!-- 中间说明 -->
  <text class="s" x="50" y="185">↑ 反序列化：字符串 → 对象（读），本章 12.01/12.02 的主角</text>
  <text class="s" x="50" y="210">↓ 序列化：对象 → 字符串（写），Retrofit 的 @Body 自动完成（Gson 同一套库）</text>
  <text class="s" x="50" y="235">✔ 解析发生在子线程（网络回调线程），解析完才切主线程更新UI——大量数据解析本身也耗时</text>
</svg>
