<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 0 780 455" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ws" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="ws2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4caf7d"/>
    </marker>
    <marker id="ws3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b3551e"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:13px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .p1 { stroke:#4a90d9; stroke-width:2.2; fill:none; marker-end:url(#ws); }
    .p2 { stroke:#4caf7d; stroke-width:2.2; fill:none; marker-end:url(#ws2); }
    .p3 { stroke:#b3551e; stroke-width:2; fill:none; stroke-dasharray:6,4; marker-end:url(#ws3); }
    .lt { font-size:12px; fill:#2c5f9e; font-weight:bold; }
    .gt { font-size:12px; fill:#4caf7d; font-weight:bold; }
  </style>

  <text class="t" x="260" y="30">WebSocket：一次握手 → 全双工长连接</text>

  <!-- 客户端 / 服务端 -->
  <rect class="b" x="60" y="60" width="160" height="60" rx="8"/>
  <text class="n" x="140" y="95" text-anchor="middle">客户端 App</text>

  <rect class="b" x="560" y="60" width="160" height="60" rx="8"/>
  <text class="n" x="640" y="95" text-anchor="middle">服务端</text>

  <!-- ① HTTP握手 -->
  <rect class="m" x="90" y="150" width="230" height="60" rx="8"/>
  <text class="s" x="205" y="172" text-anchor="middle">① GET + Upgrade: websocket</text>
  <text class="s" x="205" y="192" text-anchor="middle">（HTTP请求，带Sec-WebSocket-Key）</text>

  <rect class="m" x="460" y="150" width="230" height="60" rx="8"/>
  <text class="s" x="575" y="172" text-anchor="middle">② 101 Switching Protocols</text>
  <text class="s" x="575" y="192" text-anchor="middle">（确认升级，密钥校验通过）</text>

  <path class="p1" d="M220 120 C 240 140, 250 145, 270 165"/>
  <path class="p1" d="M490 178 H 340"/>

  <!-- 长连接 -->
  <rect class="g" x="110" y="240" width="560" height="60" rx="8"/>
  <text class="n" x="390" y="265" text-anchor="middle">③ 双工数据通道建立（此后不再是请求-响应，双方随时互发帧）</text>
  <text class="s" x="390" y="288" text-anchor="middle">服务端可主动推送：消息、通知、行情…　客户端可随时发：心跳、上报</text>

  <path class="p1" d="M200 205 C 220 225, 300 235, 340 245"/>
  <path class="p1" d="M580 205 C 560 225, 480 235, 440 245"/>

  <!-- 心跳 -->
  <rect class="b" x="110" y="330" width="250" height="70" rx="8"/>
  <text class="n" x="235" y="358" text-anchor="middle">④ 心跳保活</text>
  <text class="s" x="235" y="380" text-anchor="middle">客户端定时发ping，服务端回pong</text>

  <rect class="b" x="420" y="330" width="250" height="70" rx="8"/>
  <text class="n" x="545" y="358" text-anchor="middle">⑤ 断线重连</text>
  <text class="s" x="545" y="380" text-anchor="middle">检测断开 → 指数退避重连 + 刷新token</text>

  <path class="p2" d="M235 330 V 305" opacity="0"/>
  <path class="p3" d="M235 330 V 310"/>
  <path class="p3" d="M545 330 V 310"/>
  <text class="gt" x="60" y="420">✔ HTTP轮询：反复建连接问"有新数据吗"，大部分响应是"没有"，开销大</text>
  <text class="gt" x="60" y="440">✔ WebSocket：一条长连接双向推拉，实时性好、无重复握手（IM/推送/协同标配）</text>
</svg>
