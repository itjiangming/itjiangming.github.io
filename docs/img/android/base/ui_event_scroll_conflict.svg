<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:14px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .b2 { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .arr { stroke:#b3551e; stroke-width:2.5; fill:none; marker-end:url(#x); }
  </style>
  <defs>
    <marker id="x" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b3551e"/>
    </marker>
  </defs>

  <text class="t" x="270" y="32">三类典型的滑动冲突场景</text>

  <!-- 场景一：方向不一致 -->
  <rect class="b" x="50" y="60" width="200" height="270" rx="8"/>
  <text class="n" x="150" y="88" text-anchor="middle">场景① 方向不一致</text>
  <rect class="b2" x="70" y="105" width="160" height="190" rx="6"/>
  <text class="s" x="150" y="130" text-anchor="middle">外层：左右滑动容器</text>
  <rect class="b" x="85" y="150" width="130" height="120" rx="6"/>
  <text class="s" x="150" y="175" text-anchor="middle">内层：上下滑动列表</text>
  <path class="arr" d="M110 210 H 185"/>
  <path class="arr" d="M195 190 V 255"/>
  <text class="s" x="50" y="352">如：左右滑的 Banner 嵌上下滑的列表；</text>
  <text class="s" x="50" y="370">判断滑动方向即可决定归属</text>

  <!-- 场景二：方向一致 -->
  <rect class="b" x="280" y="60" width="200" height="270" rx="8"/>
  <text class="n" x="380" y="88" text-anchor="middle">场景② 方向一致</text>
  <rect class="b2" x="300" y="105" width="160" height="190" rx="6"/>
  <text class="s" x="380" y="130" text-anchor="middle">外层：上下滑动 ScrollView</text>
  <rect class="b" x="315" y="150" width="130" height="120" rx="6"/>
  <text class="s" x="380" y="175" text-anchor="middle">内层：上下滑动列表</text>
  <path class="arr" d="M340 200 V 250"/>
  <path class="arr" d="M420 180 V 240"/>
  <text class="s" x="280" y="352">如：ScrollView 嵌套 ScrollView / ListView；</text>
  <text class="s" x="280" y="370">无法靠方向判断，需按业务规则（如内容位置）</text>

  <!-- 场景三：嵌套组合 -->
  <rect class="b" x="510" y="60" width="200" height="270" rx="8"/>
  <text class="n" x="610" y="88" text-anchor="middle">场景③ 嵌套组合</text>
  <rect class="b2" x="530" y="105" width="160" height="190" rx="6"/>
  <text class="s" x="610" y="130" text-anchor="middle">外层：左右滑动容器</text>
  <rect class="b" x="545" y="150" width="130" height="120" rx="6"/>
  <text class="s" x="610" y="172" text-anchor="middle">中层：上下滑动</text>
  <rect class="b" x="560" y="190" width="100" height="70" rx="6"/>
  <text class="s" x="610" y="212" text-anchor="middle">内层：左右滑</text>
  <text class="s" x="510" y="352">如：ScrollView 嵌 ViewPager 嵌列表；</text>
  <text class="s" x="510" y="370">场景①②的组合，逐层拆解处理</text>
</svg>
