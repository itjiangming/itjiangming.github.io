<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .q { font-size:14px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:13px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .d { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .r { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .p { stroke:#4a90d9; stroke-width:2; fill:none; marker-end:url(#s); }
    .dt { font-size:12px; fill:#b3551e; font-weight:bold; }
  </style>

  <text class="t" x="280" y="32">本地存储方案选型决策</text>

  <!-- 起点 -->
  <rect class="r" x="40" y="60" width="180" height="55" rx="8"/>
  <text class="q" x="130" y="85" text-anchor="middle">要存储什么数据？</text>

  <!-- 分支1 -->
  <rect class="d" x="40" y="160" width="180" height="55" rx="8"/>
  <text class="n" x="130" y="185" text-anchor="middle">少量配置/开关/状态</text>
  <text class="s" x="130" y="203" text-anchor="middle">如主题、登录态、首次启动</text>

  <!-- 分支2 -->
  <rect class="d" x="290" y="160" width="180" height="55" rx="8"/>
  <text class="n" x="380" y="185" text-anchor="middle">文件类数据</text>
  <text class="s" x="380" y="203" text-anchor="middle">日志、缓存、下载、图片</text>

  <!-- 分支3 -->
  <rect class="d" x="540" y="160" width="200" height="55" rx="8"/>
  <text class="n" x="640" y="185" text-anchor="middle">结构化业务数据</text>
  <text class="s" x="640" y="203" text-anchor="middle">列表、记录、需要查询过滤</text>

  <path class="p" d="M100 115 C 100 135, 120 140, 125 155"/>
  <path class="p" d="M130 115 C 180 135, 320 140, 375 155"/>
  <path class="p" d="M170 115 C 400 140, 590 145, 630 155"/>
  <text class="dt" x="290" y="145">按数据形态分流</text>

  <!-- 方案行 -->
  <rect class="g" x="40" y="260" width="180" height="60" rx="8"/>
  <text class="n" x="130" y="285" text-anchor="middle">SharedPreferences</text>
  <text class="s" x="130" y="303" text-anchor="middle">新项目 → DataStore</text>

  <rect class="g" x="290" y="260" width="180" height="60" rx="8"/>
  <text class="n" x="380" y="285" text-anchor="middle">文件存储</text>
  <text class="s" x="380" y="303" text-anchor="middle">内部 files / 专属外部目录</text>

  <rect class="g" x="540" y="260" width="200" height="60" rx="8"/>
  <text class="n" x="640" y="285" text-anchor="middle">SQLite / Room</text>
  <text class="s" x="640" y="303" text-anchor="middle">新项目 → Room 优先</text>

  <!-- 备注行 -->
  <text class="s" x="40" y="360">✔ 应用私有数据：内部存储 / 应用专属外部目录（卸载即删、无权限）</text>
  <text class="s" x="40" y="382">✔ 要分享给其他应用（如图片分享）：FileProvider</text>
  <text class="s" x="40" y="404">✔ 公共媒体文件（相册类）：MediaStore / 分区存储（Scoped Storage）</text>
</svg>
