<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="rf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:13px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .p { stroke:#4a90d9; stroke-width:2.2; fill:none; marker-end:url(#rf); }
    .lt { font-size:12px; fill:#2c5f9e; font-weight:bold; }
  </style>

  <text class="t" x="390" y="30" text-anchor="middle">Retrofit 的分层架构：声明 → 翻译 → 执行</text>

  <!-- 1 接口声明层 -->
  <rect class="b" x="40" y="60" width="250" height="115" rx="10"/>
  <text class="n" x="165" y="88" text-anchor="middle">① 接口声明层（你写的）</text>
  <text class="s" x="55" y="112">public interface UserApi {</text>
  <text class="s" x="55" y="130">  @GET("users/{id}")</text>
  <text class="s" x="55" y="148">  Call&lt;User&gt; getUser(</text>
  <text class="s" x="65" y="164">    @Path("id") long id);</text>

  <!-- 2 动态代理 -->
  <rect class="m" x="330" y="60" width="210" height="115" rx="10"/>
  <text class="n" x="435" y="88" text-anchor="middle">② 动态代理</text>
  <text class="s" x="345" y="112">Retrofit.create(UserApi.class)</text>
  <text class="s" x="345" y="134">生成接口实现：解析注解</text>
  <text class="s" x="345" y="152">→ 组装 OkHttp Request</text>

  <!-- 3 OkHttp 执行层 -->
  <rect class="g" x="580" y="60" width="170" height="115" rx="10"/>
  <text class="n" x="665" y="88" text-anchor="middle">③ OkHttp 执行</text>
  <text class="s" x="595" y="112">拦截器责任链</text>
  <text class="s" x="595" y="130">连接池/缓存（11.01）</text>
  <text class="s" x="595" y="148">真正的网络IO</text>

  <path class="p" d="M290 115 H 325"/>
  <path class="p" d="M540 115 H 575"/>
  <text class="lt" x="310" y="52" text-anchor="middle">create()</text>
  <text class="lt" x="570" y="52" text-anchor="middle">Call→execute/enqueue</text>

  <!-- 4 转换器 -->
  <rect class="g" x="330" y="230" width="210" height="90" rx="10"/>
  <text class="n" x="435" y="258" text-anchor="middle">④ Converter 转换器</text>
  <text class="s" x="345" y="282">GsonConverterFactory：</text>
  <text class="s" x="345" y="302">ResponseBody → User对象</text>

  <!-- 5 回调 -->
  <rect class="b" x="580" y="230" width="170" height="90" rx="10"/>
  <text class="n" x="665" y="258" text-anchor="middle">⑤ 回调/返回</text>
  <text class="s" x="595" y="282">onResponse(call,</text>
  <text class="s" x="595" y="300">response)&lt;User&gt;</text>

  <path class="p" d="M435 175 V 225"/>
  <path class="p" d="M540 275 H 575"/>

  <!-- 使用入口 -->
  <rect class="b" x="40" y="230" width="250" height="90" rx="10"/>
  <text class="n" x="165" y="258" text-anchor="middle">使用入口</text>
  <text class="s" x="55" y="282">UserApi api = retrofit</text>
  <text class="s" x="65" y="300">  .create(UserApi.class);</text>
  <text class="s" x="55" y="318">api.getUser(1).enqueue(cb);</text>

  <path class="p" d="M290 275 H 325"/>

  <!-- 结论 -->
  <text class="s" x="40" y="370">✔ Retrofit 只做"翻译"：把注解声明的接口方法翻译成 OkHttp 的 Request，再解析 Response 成对象</text>
  <text class="s" x="40" y="392">✔ 网络能力全部复用 OkHttp（11.01 的拦截器照常生效）；三件套 = Retrofit + OkHttp + Gson</text>
  <text class="s" x="40" y="414">✔ Retrofit 实例必须单例（持有转换器/回调执行器），不同 baseUrl 可建多个实例</text>
</svg>
