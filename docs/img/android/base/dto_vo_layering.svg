<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:14px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .code { font-family:Consolas,monospace; font-size:11px; fill:#3d5866; }
    .p { stroke:#4a90d9; stroke-width:2.2; fill:none; marker-end:url(#dv); }
    .lab { font-size:12px; fill:#2c5f9e; font-weight:bold; }
  </style>

  <text class="t" x="270" y="30">DTO / VO 分层：服务端字段与 UI 的隔离带</text>

  <!-- 服务端 -->
  <rect class="m" x="40" y="60" width="220" height="150" rx="10"/>
  <text class="n" x="150" y="88" text-anchor="middle">服务端 JSON（不稳定）</text>
  <text class="code" x="55" y="112">{"status":0,</text>
  <text class="code" x="55" y="130"> "data":{"article_list":[{</text>
  <text class="code" x="65" y="148">"art_id":1,</text>
  <text class="code" x="65" y="166">"art_title":"...",</text>
  <text class="code" x="65" y="184">"publish_time":1731561600}]}}</text>

  <!-- DTO -->
  <rect class="b" x="300" y="60" width="220" height="150" rx="10"/>
  <text class="n" x="410" y="88" text-anchor="middle">DTO（忠实搬运层）</text>
  <text class="code" x="315" y="112">class ArticleDto {</text>
  <text class="code" x="325" y="130">@SerializedName("art_id")</text>
  <text class="code" x="325" y="148">long id;</text>
  <text class="code" x="325" y="166">@SerializedName("art_title")</text>
  <text class="code" x="325" y="184">String title;</text>

  <!-- VO -->
  <rect class="g" x="560" y="60" width="200" height="150" rx="10"/>
  <text class="n" x="660" y="88" text-anchor="middle">VO（UI 业务模型）</text>
  <text class="code" x="575" y="112">class ArticleVo {</text>
  <text class="code" x="585" y="130">long id; String title;</text>
  <text class="code" x="585" y="148">String dateText; // "11-14"</text>
  <text class="code" x="585" y="166">boolean isTop;   // UI标记</text>
  <text class="code" x="585" y="184">String authorName;</text>

  <path class="p" d="M260 135 H 295"/>
  <path class="p" d="M520 135 H 555"/>
  <text class="lab" x="277" y="52" text-anchor="middle">Gson映射</text>
  <text class="lab" x="537" y="52" text-anchor="middle">Mapper 转换</text>

  <!-- Mapper -->
  <rect class="g" x="300" y="250" width="220" height="60" rx="10"/>
  <text class="n" x="410" y="278" text-anchor="middle">Mapper（唯一翻译点）</text>
  <text class="code" x="315" y="298">ArticleVo vo = m.toVo(dto);</text>

  <path class="p" d="M410 210 V 245"/>

  <!-- 好处 -->
  <rect class="b" x="40" y="340" width="720" height="110" rx="10"/>
  <text class="n" x="400" y="368" text-anchor="middle">分层的收益</text>
  <text class="s" x="60" y="394">✔ 服务端改字段名/结构 → 只改 DTO 映射一处；UI 代码零改动（隔离变化）</text>
  <text class="s" x="60" y="418">✔ UI 语义在 VO 里表达（dateText、isTop）——View 不做时间格式化/业务判断</text>
  <text class="s" x="60" y="442">✔ 测试友好：Mapper 是纯函数，单测覆盖"JSON变化 → VO输出"即可</text>
</svg>
