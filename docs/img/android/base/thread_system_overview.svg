<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>
  <style>
    .t { font-size:17px; font-weight:bold; fill:#2c3e50; }
    .n { font-size:14px; font-weight:bold; fill:#2c5f9e; }
    .s { font-size:12px; fill:#5b6b7a; }
    .b { fill:#f4f8fb; stroke:#4a90d9; stroke-width:2; }
    .g { fill:#eef8ef; stroke:#4caf7d; stroke-width:2; }
    .m { fill:#fff7ef; stroke:#e07b39; stroke-width:2; }
    .p { stroke:#4a90d9; stroke-width:2; fill:none; marker-end:url(#t); }
  </style>

  <text class="t" x="260" y="32">Android 线程体系总览</text>

  <!-- 主线程 -->
  <rect class="m" x="50" y="60" width="330" height="120" rx="10"/>
  <text class="n" x="215" y="90" text-anchor="middle">主线程 / UI 线程（Main Thread）</text>
  <text class="s" x="70" y="120">✔ 进程启动时创建，唯一持有 Looper 的默认线程</text>
  <text class="s" x="70" y="142">✔ 职责：UI 绘制、事件分发、生命周期回调</text>
  <text class="s" x="70" y="164">✘ 禁止耗时操作（超过阈值触发 ANR）</text>

  <!-- 工作线程 -->
  <rect class="b" x="400" y="60" width="330" height="120" rx="10"/>
  <text class="n" x="565" y="90" text-anchor="middle">工作线程（Worker Thread）</text>
  <text class="s" x="420" y="120">✔ Thread / 线程池 / HandlerThread / 协程</text>
  <text class="s" x="420" y="142">✔ 职责：网络请求、磁盘 IO、数据计算、解码</text>
  <text class="s" x="420" y="164">✘ 禁止直接更新 UI（单线程模型）</text>

  <!-- 通信桥梁 -->
  <rect class="g" x="170" y="230" width="440" height="80" rx="10"/>
  <text class="n" x="390" y="260" text-anchor="middle">Handler 消息机制 —— 跨线程通信的桥梁</text>
  <text class="s" x="390" y="285" text-anchor="middle">工作线程发消息（handler.sendMessage / post）→ 主线程 Looper 派发处理</text>

  <path class="p" d="M215 180 C 215 215, 300 225, 300 245"/>
  <path class="p" d="M565 180 C 565 215, 480 225, 480 245"/>

  <!-- 线程池 -->
  <rect class="b" x="60" y="345" width="320" height="70" rx="10"/>
  <text class="n" x="220" y="373" text-anchor="middle">线程池（ThreadPoolExecutor）</text>
  <text class="s" x="220" y="397" text-anchor="middle">复用线程、控制并发数、统一管理（推荐）</text>

  <rect class="b" x="400" y="345" width="320" height="70" rx="10"/>
  <text class="n" x="560" y="373" text-anchor="middle">协程（Kotlin，后续章节）</text>
  <text class="s" x="560" y="397" text-anchor="middle">挂起式轻量并发，结构化取消</text>
</svg>
